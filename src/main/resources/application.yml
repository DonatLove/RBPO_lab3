spring:
  application:
    name: lost-and-found-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lost_and_found}
    username: ${DB_USERNAME:lost_found_app}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never
  jackson:
    serialization:
      write-dates-as-timestamps: false

application:
  name: lost-and-found-service
  description: REST API бюро находок, вариант 15
  version: 3.0.0
